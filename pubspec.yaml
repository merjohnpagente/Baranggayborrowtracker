name: barangay_borrow_tracker
description: >-
  Barangay Borrow Tracker - asset borrowing, reservation and return monitoring
  for a Philippine barangay.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # On-device storage. The app has no server: everything lives in a JSON
  # database plus photo files inside the app's private documents folder.
  path_provider: ^2.1.4
  # Password hashing for the local accounts (SHA-256 + per-user salt).
  crypto: ^3.0.3

  # Navigation & state
  go_router: ^14.2.7
  provider: ^6.1.2

  # Utilities
  intl: ^0.19.0
  image_picker: ^1.1.2

  # Settings: installed version + opening the GitHub profile.
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

  # QR codes
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2

  # Vector artwork (app mark, category icons)
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Generates the Android launcher icons from assets/icon/app_icon_1024.png.
  # Run by CI after `flutter create` produces the android/ folder.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    # CC BY / CC BY-SA require the attribution to travel with the pictures, so
    # the credits are bundled into the APK rather than living only in the repo.
    - assets/ATTRIBUTION.md

# Launcher icon.
#
# The android/ folder is git-ignored and generated in CI, so the launcher
# icons cannot be committed — they are regenerated from this 1024x1024 source
# on every build via `dart run flutter_launcher_icons`.
#
# `remove_alpha_ios` and the adaptive-icon background keep the icon from getting
# a keyline or a scrim around it on Android 8+, which is what makes a flat
# square mark look wrong on a modern launcher.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon_1024.png"
  adaptive_icon_background: "#103B63"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground_1024.png"
  min_sdk_android: 23
  remove_alpha_ios: true