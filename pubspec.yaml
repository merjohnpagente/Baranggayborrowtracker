name: barangay_borrow_tracker
description: >-
  Barangay Borrow Tracker - asset borrowing, reservation and return monitoring
  for a Philippine barangay.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.3.4

  # Navigation & state
  go_router: ^14.2.7
  provider: ^6.1.2

  # Utilities
  intl: ^0.19.0
  image_picker: ^1.1.2

  # QR codes
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2

  # Vector artwork (app mark, category icons)
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/