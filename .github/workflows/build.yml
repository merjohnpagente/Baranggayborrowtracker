name: Build Android APK

# Barangay Borrow Tracker Android pipeline.
#
# TEST first, BUILD only when green — so an APK in the artifacts section can
# never have come from code that failed analysis or tests.
#
# No Flutter SDK needed locally: everything runs here. `android/` is
# git-ignored, so it is generated in the cloud and the launcher icons are
# rendered from assets/icon/app_icon_1024.png on each build.
#
# This is a prototype: the APK is published only as a workflow artifact.
# The workflow deliberately creates no GitHub release and no "Latest" tag.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only: building and uploading an artifact needs no write access.
permissions:
  contents: read

# The app keeps everything on the device. The only build-time setting left is
# the barangay name shown on screen; no database credentials are needed.
env:
  BARANGAY_NAME: ${{ vars.BARANGAY_NAME }}

jobs:
  # ---- 1) TEST: analyze + tests. The APK waits for this. ----
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java 17 is the toolchain the Android Gradle Plugin and Gradle expect;
      # pinning it here avoids a mismatch that only shows up mid-build.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap platform folders if missing
        run: |
          if [ ! -d android/app ]; then
            cp lib/main.dart /tmp/main.dart.bak
            flutter create --platforms=android --org ph.barangay --project-name barangay_borrow_tracker .
            # `flutter create` treats an existing entry point as replaceable;
            # restoring it keeps the build failing on our code, not on a
            # regenerated scaffold.
            cp /tmp/main.dart.bak lib/main.dart
            # The scaffold's own test instantiates `MyApp`, which this project
            # does not have. Left in place it would fail the Test job.
            rm -f test/widget_test.dart
          fi

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  # ---- 2) BUILD APK (only when Test is green) ----
  apk:
    name: APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap platform folders if missing
        run: |
          if [ ! -d android/app ]; then
            cp lib/main.dart /tmp/main.dart.bak
            flutter create --platforms=android --org ph.barangay --project-name barangay_borrow_tracker .
            cp /tmp/main.dart.bak lib/main.dart
            rm -f test/widget_test.dart
          fi

      - name: Configure Android (label, camera permission, minSdk)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="Barangay Borrow Tracker"/' "$MANIFEST"

          # QR scanning needs the camera. Declared as not-required so the app
          # still installs on a device without one — every other feature
          # (browsing, requesting, history) works without scanning.
          python3 - "$MANIFEST" <<'PY'
          import sys, re
          path = sys.argv[1]
          src = open(path, encoding="utf-8").read()
          perms = [
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.CAMERA"/>',
          ]
          missing = [p for p in perms if p not in src]
          if missing:
              block = "    " + "\n    ".join(missing) + "\n"
              src = src.replace("<application", block + "    <application", 1)
          if "uses-feature" not in src:
              src = src.replace(
                  "<application",
                  '    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <application',
                  1)
          open(path, "w", encoding="utf-8").write(src)
          print("permissions patched")
          PY

          # mobile_scanner uses MLKit, which needs API 21+; Flutter's default
          # min is already higher, so this is only asserted, not lowered.
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ]; then
              grep -n "minSdk" "$f"
            fi
          done

      - run: flutter pub get

      - name: Generate launcher icons
        # Without this the APK ships with Flutter's default launcher icon: the
        # android/ folder is regenerated on every build, so the icons cannot be
        # committed as files.
        run: dart run flutter_launcher_icons

      # Phones only: 64-bit ARM for anything modern, 32-bit ARM for old
      # handsets. x86_64 is left out on purpose — it exists only on emulators,
      # so including it would bloat the APK without helping a single phone.
      - name: Build release APK for phones
        run: |
          flutter build apk --release \
            --target-platform android-arm64,android-arm \
            --dart-define=BARANGAY_NAME="$BARANGAY_NAME"

      # Named for what it is, so the download is recognisable in the artifacts
      # list rather than "app-release.apk".
      - name: Rename
        run: cp build/app/outputs/flutter-apk/app-release.apk Barangay-Borrow-Tracker.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: barangay-borrow-tracker-apk
          path: Barangay-Borrow-Tracker.apk
          retention-days: 30